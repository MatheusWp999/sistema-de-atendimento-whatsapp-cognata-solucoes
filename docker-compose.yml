services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: central_ia_whatsapp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: central_ia_whatsapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d central_ia_whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: central_ia_whatsapp_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/central_ia_whatsapp?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    command: sh -c "npm run prisma:migrate:deploy && npm start"

  worker-outbound:
    build: .
    container_name: central_ia_whatsapp_worker_outbound
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/central_ia_whatsapp?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    command: npm run worker:outbound

  worker-summary:
    build: .
    container_name: central_ia_whatsapp_worker_summary
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/central_ia_whatsapp?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    command: npm run worker:summary

  worker-whatsapp:
    build: .
    container_name: central_ia_whatsapp_worker_whatsapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/central_ia_whatsapp?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    command: npm run worker:whatsapp

volumes:
  postgres_data:
